<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>j0nixRSS example</title>
	<style>
		:root { color-scheme: light dark; --border: #8884; --muted: #888; --accent: #3383bb; }
		body { margin: 2rem auto; max-width: 900px; padding: 0 1rem; font: 15px/1.5 system-ui, sans-serif; }
		h1 { font-size: 1.4rem; }
		.list { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-bottom: 0.6rem; }
		.list span { width: 7rem; color: var(--muted); font-size: 0.85rem; }
		.list button { padding: 0.3rem 0.8rem; border: 1px solid var(--border); border-radius: 999px; background: none; color: inherit; font: inherit; cursor: pointer; }
		.list button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
		#feed { margin-top: 1rem; }
		.item { display: flow-root; padding: 0.8rem 1rem; margin-bottom: 0.6rem; border: 1px solid var(--border); border-radius: 8px; }
		.item img { float: left; width: 160px; aspect-ratio: 16 / 9; object-fit: cover; margin-right: 1rem; border-radius: 4px; }
		a { color: var(--accent); text-decoration: none; }
		.item a { font-weight: 600; }
		.item p { margin: 0.3rem 0; }
		.muted { color: var(--muted); font-size: 0.85rem; }
	</style>
</head>
<body>
	<h1>j0nixRSS example</h1>
	<div id="lists"></div>
	<div id="feed" role="tabpanel" aria-live="polite"></div>

	<script>
	// Path to j0nixRSS.php, relative to this page
	var API = "j0nixRSS.php";

	// Each list is requested with its own parameter: ?rss=<name> or ?youtube=<name>
	var LISTS = [
		{ key: "rss", title: "Reading list" },
		{ key: "youtube", title: "YouTube" }
	];

	var lists = document.getElementById("lists");
	var feed = document.getElementById("feed");

	// Feed text can contain HTML entities (&amp;); decode them without ever parsing feed content as live HTML
	function decode(str) {
		return new DOMParser().parseFromString(str || "", "text/html").documentElement.textContent;
	}

	// Only allow http(s) links from feeds
	function safeUrl(url) {
		try {
			var u = new URL(url);
			return u.protocol === "http:" || u.protocol === "https:" ? u.href : null;
		} catch (e) {
			return null;
		}
	}

	// Create an element with text content; feed data is always inserted as text, never as HTML
	function el(tag, text, attrs) {
		var node = document.createElement(tag);
		if (text) node.textContent = text;
		for (var k in attrs || {}) node.setAttribute(k, attrs[k]);
		return node;
	}

	function link(text, url) {
		var href = safeUrl(url);
		return href ? el("a", text, { href: href, target: "_blank", rel: "noopener noreferrer" }) : el("strong", text);
	}

	function show(list, name) {
		lists.querySelectorAll("button").forEach(function (b) {
			b.setAttribute("aria-selected", b.dataset.list === list && b.dataset.feed === name ? "true" : "false");
		});
		feed.replaceChildren(el("p", "Loading " + name + "...", { class: "muted" }));

		fetch(API + "?" + list + "=" + encodeURIComponent(name) + "&limit=10&truncate=200")
			.then(function (r) { return r.json(); })
			.then(function (data) {
				if (!data.channel) throw new Error(data.error || "No channel");
				var head = el("p", null, { class: "muted" });
				head.append(link(decode(data.channel), data.link));
				if (data.description) head.append(" - " + decode(data.description));
				feed.replaceChildren(head);

				data.item.forEach(function (item) {
					var div = el("div", null, { class: "item" });
					// Only YouTube items have a thumbnail
					var thumb = safeUrl(item.thumbnail);
					if (thumb) div.append(el("img", null, { src: thumb, alt: "", loading: "lazy" }));
					div.append(link(decode(item.title), item.link));
					if (item.description) div.append(el("p", decode(item.description)));
					if (item.pubDate) div.append(el("div", new Date(item.pubDate).toLocaleString(), { class: "muted" }));
					feed.append(div);
				});
			})
			.catch(function (e) {
				feed.replaceChildren(el("p", "Failed to load " + name + ": " + e.message, { class: "muted" }));
			});
	}

	// The feed list request returns { rss: { name: url, ... }, youtube: { name: channelId, ... } }.
	// Make one row of tabs per list; a list with no entries gets no row.
	fetch(API)
		.then(function (r) { return r.json(); })
		.then(function (info) {
			var first = null;
			LISTS.forEach(function (l) {
				var names = Object.keys(info[l.key] || {});
				if (!names.length) return;
				var row = el("div", null, { class: "list", role: "tablist", "aria-label": l.title });
				row.append(el("span", l.title));
				names.forEach(function (name) {
					var b = el("button", decode(name), { type: "button", role: "tab" });
					b.dataset.list = l.key;
					b.dataset.feed = name;
					b.addEventListener("click", function () { show(l.key, name); });
					row.append(b);
				});
				lists.append(row);
				if (!first) first = [l.key, names[0]];
			});
			if (first) show(first[0], first[1]);
			else feed.replaceChildren(el("p", "No feeds configured.", { class: "muted" }));
		})
		.catch(function (e) {
			feed.replaceChildren(el("p", "Failed to load the feed list: " + e.message, { class: "muted" }));
		});
	</script>
</body>
</html>
